# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Muuuuuuuuuuuu

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest
modules:
  - type: script
    snippets:
      - |
        set -euo pipefail
        f=/usr/share/dnf5/repos.d/terra.repo
        cp -a "$f" "$f.bb-orig"
        sed -i -E 's/^enabled[[:space:]]*=[[:space:]]*(0|false)[[:space:]]*$/enabled=1/' "$f"
        echo "--- terra.repo depois do sed ---"
        grep -n -E '^\[|^enabled' "$f"

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
    install:
      packages:
        - brave-origin
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit
        - nautilus-open-any-terminal
        - faugus-launcher
        - android-tools
        - awww
        - nwg-look
        - loupe
        - gnome-text-editor
        - python3-tkinter
        - firefox
        - umbriel-nightly
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common

  - type: script
    snippets:
      - mv /usr/share/dnf5/repos.d/terra.repo.bb-orig /usr/share/dnf5/repos.d/terra.repo
