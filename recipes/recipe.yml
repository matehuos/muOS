# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: arisu
description: Minha instalação gamer (umbriel + noctalia + GNOME), migrada do CachyOS

base-image: ghcr.io/ublue-os/bazzite-gnome   # AMD/Intel + GNOME (mantém GDM e GNOME ao lado)
image-version: latest

modules:
  # ---------- Brave Origin (estável) ----------
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      packages:
        - brave-origin

  # ---------- Umbriel + Noctalia ----------
  - type: dnf
    repos:
      cleanup: true
      files:
        # Terra: fonte do umbriel no Fedora
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - umbriel-nightly
        - noctalia          
        - wlr-randr

  # ---------- Pacotes do sistema (RPM) ----------
  - type: dnf
    install:
      packages:
        # terminais e shell
        - kitty
        - fish
        # utilitários de terminal
        - btop
        - fastfetch
        - mpv
        # GNOME
        - gnome-tweaks
        # sistema
        - ddcutil
        # cockpit
        - cockpit
        - cockpit-podman
        - cockpit-storaged
        - cockpit-machines

  # ---------- Flatpaks ----------
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # jogos
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - com.github.mtkennerly.ludusavi
          - io.github.radiolamp.mangojuice
          - io.github.antimicrox.antimicrox
          # comunicação
          - com.discordapp.Discord
          - org.telegram.desktop
          - com.ktechpit.whatsie
          - me.proton.Mail
          # mídia
          - com.spotify.Client
          - org.musicbrainz.Picard
          - org.nicotine_plus.Nicotine
          - com.github.johnfactotum.Foliate
          - com.yacreader.YACReader
          # navegadores e produtividade
          - org.mozilla.firefox
          - org.zotero.Zotero
          - net.ankiweb.Anki
          - org.qbittorrent.qBittorrent
          - io.unobserved.furtherance
          # gerenciamento do sistema
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - io.github.kolunmi.Bazaar
          - it.mijorus.gearlever
          - ca.desrt.dconf-editor
          - com.mattjakeman.ExtensionManager
          - com.github.marhkb.Pods
          - io.github.vikdevelop.SaveDesktop
          - com.sidevesh.Luminance
          - page.tesk.Refine
          - io.github.alamahant.Asteria
          - io.github.arijanj.Mimic
          - land.arcana.TarotCanvas
          - org.pvermeer.WebAppHub
