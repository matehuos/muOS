# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: arisu
description: Minha instalação gamer (Hyprland + Noctalia + GNOME), migrada do CachyOS

base-image: ghcr.io/ublue-os/bazzite-gnome   # AMD/Intel + GNOME (mantém GDM e GNOME ao lado)
image-version: latest

modules:
  # ---------- Pacotes RPM Unificados (Brave + COPR Hyprland/Noctalia + Sistema) ----------
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - lionheartp/Hyprland
    install:
      packages:
        # Navegador
        - brave-origin
        - hyprland
        - xdg-desktop-portal-hyprland
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit

