# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Muuuuuuuuuuuu

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  # 1. Remove qualquer arquivo terra.repo pré-existente (em /etc ou /usr) para evitar conflito de ID duplicado no módulo DNF
  - type: script
    snippets:
      - rm -f /etc/yum.repos.d/*terra*.repo /usr/share/dnf5/repos.d/*terra*.repo /usr/etc/yum.repos.d/*terra*.repo

  # 2. Instala tudo em uma única camada e deixa o próprio BlueBuild gerenciar e limpar (cleanup: true) o terra.repo
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - lionheartp/Hyprland
        - paolino/hyprmoncfg
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common
    install:
      packages:
        - brave-origin
        - firefox
        - umbriel-nightly
        - hyprmoncfg
        - awww
        - wlr-randr
        - nwg-look
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit
        - nautilus-open-any-terminal
        - faugus-launcher
        - android-tools
        - loupe
        - gnome-text-editor
        - python3-tkinter
