# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Minha instalação gamer (Hyprland + Noctalia + GNOME), migrada do CachyOS

base-image: ghcr.io/ublue-os/bazzite-gnome   # AMD/Intel + GNOME (mantém GDM e GNOME ao lado)
image-version: latest

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - lionheartp/Hyprland
        - paolino/hyprmoncfg
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
        - c0mpile/builds
    install:
      packages:
        - brave-origin
        - hyprland
        - hyprland-guiutils
        - xdg-desktop-portal-hyprland
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit
        - nautilus-open-any-terminal
        - hyprmoncfg
        - faugus-launcher
        - android-tools
        - awww
        - wlr-randr
        - nwg-look
        - loupe
        - gnome-text-editor
        - umbriel-git
        - xdg-desktop-portal-umbriel-git

