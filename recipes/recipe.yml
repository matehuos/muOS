# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Minha instalação gamer (Hyprland + Noctalia + GNOME), migrada do CachyOS

base-image: ghcr.io/ublue-os/bazzite-gnome   # AMD/Intel + GNOME (mantém GDM e GNOME ao lado)
image-version: latest
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
    install:
      packages:
        - brave-origin
        - noctalia
        - kitty
        - mpv
        - cockpit
        - nautilus-open-any-terminal
        - faugus-launcher
        - android-tools
        - awww
        - wlr-randr
        - nwg-look
        - loupe
        - gnome-text-editor
        - python3-tkinter
        - firefox
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common

  # Terra: ativo só neste passo, só para o umbriel
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - umbriel-nightly
