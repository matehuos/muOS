# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Muuuuuuuuuuuu

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  # 1. Garante que o repo Terra nativo do Bazzite (F44 ou F45) esteja ativo para o módulo DNF
  - type: script
    snippets:
      - |
        set -euo pipefail
        for repo in /etc/yum.repos.d/terra.repo /usr/share/dnf5/repos.d/terra.repo; do
          if [ -f "$repo" ]; then
            sed -i 's/enabled=0/enabled=1/g' "$repo"
          fi
        done

  # 2. Único módulo DNF: consolida camadas, reduz tempo de download de metadados e limpa tudo no final
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - lionheartp/Hyprland
        - paolino/hyprmoncfg
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common
    install:
      packages:
        # Navegadores
        - brave-origin
        - firefox
        # Sessão / Compositor Wayland (Umbriel + Utilitários)
        - umbriel-nightly
        - hyprmoncfg
        - awww
        - wlr-randr
        - nwg-look
        # Apps e Ferramentas
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit
        - nautilus-open-any-terminal
        - faugus-launcher
        - android-tools
        - loupe
        - gnome-text-editor
        - python3-tkinter

  # 3. Trava o Terra novamente após a instalação (Boa prática no Bazzite para evitar conflitos em futuros upgrades)
  - type: script
    snippets:
      - |
        set -euo pipefail
        for repo in /etc/yum.repos.d/terra.repo /usr/share/dnf5/repos.d/terra.repo; do
          if [ -f "$repo" ]; then
            sed -i 's/enabled=1/enabled=0/g' "$repo"
          fi
        done
