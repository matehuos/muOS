# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: muos
description: Muuuuuuuuuuuu

base-image: ghcr.io/ublue-os/bazzite-gnome   
image-version: latest
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - monkeygold/nautilus-open-any-terminal
        - faugus/faugus-launcher
        - lionheartp/Hyprland
    install:
      packages:
        - brave-origin
        - noctalia
        - kitty
        - mpv
        - gnome-tweaks
        - cockpit
        - nautilus-open-any-terminal
        - faugus-launcher
        - android-tools
        - awww
        - wlr-randr
        - nwg-look
        - loupe
        - gnome-text-editor
        - python3-tkinter
        - firefox
        - openssl3-libs.i686 #gambiarra acel
    remove:
      packages:
        - rom-properties-utils
        - rom-properties-gtk4
        - rom-properties-localsearch3
        - rom-properties
        - rom-properties-common

  - type: dnf
    repos:
      cleanup: true
      enable:
        - terra
    install:
      packages:
        - umbriel-nightly
        
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - fix-permissions.sh
